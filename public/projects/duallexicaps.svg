<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DualLexiCaps: hate speech detection with capsule networks and summarization</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D1B18"/><stop offset="1" stop-color="#2B2620"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#C8A86A" stop-opacity="0.28"/><stop offset="1" stop-color="#C8A86A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#glow)"/>

  <!-- connections: bubbles -> capsule layer 1 -->
  <g stroke="#5A544A" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M250 85 C 290 85, 290 83, 325 83"/>
    <path d="M250 85 C 290 85, 290 128, 325 128"/>
    <path d="M270 162 C 300 162, 300 128, 325 128"/>
    <path d="M270 162 C 300 162, 300 173, 325 173"/>
    <path d="M270 162 C 300 162, 300 218, 325 218"/>
    <path d="M230 236 C 290 236, 290 218, 325 218"/>
  </g>
  <!-- capsule layer 1 -> layer 2 -->
  <g stroke="#C8A86A" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M395 83 L 420 118"/><path d="M395 128 L 420 118"/><path d="M395 173 L 420 118"/>
    <path d="M395 128 L 420 196"/><path d="M395 173 L 420 196"/><path d="M395 218 L 420 196"/>
    <path d="M490 118 L 512 150"/><path d="M490 196 L 512 170"/>
  </g>

