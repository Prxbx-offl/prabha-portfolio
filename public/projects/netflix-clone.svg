<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Streaming platform: featured banner and rows of titles</title>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2C3A"/><stop offset="0.55" stop-color="#2A2230"/><stop offset="1" stop-color="#16161A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121214" stop-opacity="0.9"/><stop offset="0.6" stop-color="#121214" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8A86A"/><stop offset="1" stop-color="#6E5530"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E7A8C"/><stop offset="1" stop-color="#1F3540"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4584E"/><stop offset="1" stop-color="#4A2220"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A8A5A"/><stop offset="1" stop-color="#2A3A22"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A6AA0"/><stop offset="1" stop-color="#2E2742"/></linearGradient>
  </defs>
  <rect width="640" height="320" fill="#121214"/>

  <!-- top bar -->
  <rect x="30" y="16" width="54" height="14" rx="4" fill="#C8A86A"/>
  <g fill="#55555C">
    <rect x="102" y="20" width="34" height="6" rx="3"/><rect x="144" y="20" width="40" height="6" rx="3"/>
    <rect x="192" y="20" width="30" height="6" rx="3"/>
  </g>
  <circle cx="574" cy="23" r="7" fill="none" stroke="#9A9AA2" stroke-width="2"/>
  <line x1="579" y1="28" x2="584" y2="33" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round"/>
  <rect x="596" y="14" width="18" height="18" rx="4" fill="#4E7A8C"/>

  <!-- hero banner -->
  <rect x="30" y="44" width="580" height="150" rx="12" fill="url(#hero)"/>
  <circle cx="500" cy="110" r="90" fill="#C8A86A" opacity="0.10"/>
  <circle cx="530" cy="96" r="46" fill="#C8A86A" opacity="0.12"/>
  <rect x="30" y="44" width="580" height="150" rx="12" fill="url(#fade)"/>
  <rect x="52" y="66" width="64" height="16" rx="4" fill="#C8A86A" opacity="0.9"/>
  <text x="84" y="77.5" text-anchor="middle" font-size="9" font-weight="800" fill="#121214">FEATURED</text>
  <rect x="52" y="92" width="190" height="16" rx="5" fill="#F2EEE6"/>
  <rect x="52" y="116" width="150" height="7" rx="3.5" fill="#8C8A90"/>
  <rect x="52" y="129" width="120" height="7" rx="3.5" fill="#8C8A90"/>
  <rect x="52" y="150" width="78" height="28" rx="6" fill="#F2EEE6"/>
  <path d="M66 157 L 66 171 L 78 164 Z" fill="#121214"/>
  <text x="104" y="168.5" text-anchor="middle" font-size="11" font-weight="800" fill="#121214">Play</text>
  <rect x="138" y="150" width="28" height="28" rx="6" fill="#3A3A42"/>
  <path d="M152 158 V 170 M146 164 H 158" stroke="#F2EEE6" stroke-width="2.2" stroke-linecap="round"/>

  <!-- row -->
  <rect x="30" y="208" width="96" height="7" rx="3.5" fill="#8C8A90"/>
  <rect x="30" y="224" width="104" height="72" rx="8" fill="url(#p1)"/>
  <rect x="146" y="224" width="104" height="72" rx="8" fill="url(#p2)"/>
  <rect x="262" y="224" width="104" height="72" rx="8" fill="url(#p3)"/>
  <rect x="378" y="224" width="104" height="72" rx="8" fill="url(#p4)"/>
  <rect x="494" y="224" width="116" height="72" rx="8" fill="url(#p5)"/>
  <rect x="146" y="290" width="62" height="3" rx="1.5" fill="#C8A86A"/>
  <g fill="#fff" opacity="0.85">
    <path d="M78 252 L 78 268 L 92 260 Z"/>
  </g>
</svg>
