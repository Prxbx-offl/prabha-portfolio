<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Face emotion detection: detected face with emotion confidence scores</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/><stop offset="1" stop-color="#22282A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.33" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#5FC2AA" stop-opacity="0.18"/><stop offset="1" stop-color="#5FC2AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FC2AA" stop-opacity="0"/><stop offset="1" stop-color="#5FC2AA" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#glow)"/>

  <!-- face -->
  <path d="M150 300 C 150 245, 180 228, 210 228 C 240 228, 270 245, 270 300 Z" fill="#3A3F40"/>
  <ellipse cx="210" cy="150" rx="66" ry="80" fill="#C99E77"/>
  <path d="M144 140 C 140 80, 180 62, 212 64 C 250 66, 282 88, 276 140 C 268 112, 246 100, 210 100 C 176 100, 152 112, 144 140 Z" fill="#2B2420"/>
  <ellipse cx="186" cy="150" rx="6" ry="7" fill="#2B2420"/>
  <ellipse cx="234" cy="150" rx="6" ry="7" fill="#2B2420"/>
  <path d="M176 134 q10 -6 20 0 M224 134 q10 -6 20 0" stroke="#2B2420" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M188 192 Q 210 214 232 192" stroke="#7A3E33" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- scan band -->
  <rect x="122" y="150" width="176" height="44" fill="url(#scan)"/>
  <line x1="122" y1="194" x2="298" y2="194" stroke="#5FC2AA" stroke-width="1.5"/>

  <!-- landmarks -->
  <g fill="#5FC2AA">
    <circle cx="186" cy="150" r="2.6"/><circle cx="234" cy="150" r="2.6"/>
    <circle cx="210" cy="172" r="2.6"/><circle cx="188" cy="192" r="2.6"/>
    <circle cx="232" cy="192" r="2.6"/><circle cx="210" cy="204" r="2.6"/>
    <circle cx="176" cy="134" r="2.2"/><circle cx="244" cy="134" r="2.2"/>
  </g>

  <!-- bounding box corners -->
  <g stroke="#5FC2AA" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M122 92 V 66 H 148"/><path d="M272 66 H 298 V 92"/>
    <path d="M122 216 V 242 H 148"/><path d="M272 242 H 298 V 216"/>
  </g>
  <rect x="122" y="34" width="112" height="24" rx="12" fill="#5FC2AA"/>
  <text x="178" y="50.5" text-anchor="middle" font-size="12" font-weight="700" fill="#10201C">Happy · 0.92</text>

  <!-- emotion scores -->
  <g font-size="13" font-weight="600" fill="#CFC8BC">
    <text x="370" y="92">Happy</text>
    <text x="370" y="132">Neutral</text>
    <text x="370" y="172">Surprise</text>
    <text x="370" y="212">Sad</text>
    <text x="370" y="252">Angry</text>
  </g>
  <g fill="#30383A">
    <rect x="450" y="82" width="150" height="12" rx="6"/>
    <rect x="450" y="122" width="150" height="12" rx="6"/>
    <rect x="450" y="162" width="150" height="12" rx="6"/>
    <rect x="450" y="202" width="150" height="12" rx="6"/>
    <rect x="450" y="242" width="150" height="12" rx="6"/>
  </g>
  <rect x="450" y="82" width="138" height="12" rx="6" fill="#5FC2AA"/>
  <rect x="450" y="122" width="34" height="12" rx="6" fill="#8A9A97"/>
  <rect x="450" y="162" width="20" height="12" rx="6" fill="#8A9A97"/>
  <rect x="450" y="202" width="12" height="12" rx="6" fill="#8A9A97"/>
  <rect x="450" y="242" width="12" height="12" rx="6" fill="#8A9A97"/>
  <circle cx="352" cy="88" r="5" fill="#5FC2AA"/>
  <text x="370" y="290" font-size="11" font-weight="600" fill="#6E7775" letter-spacing="1.5">REAL-TIME · CNN · OPENCV</text>
</svg>
